# The PR and main half of the pipeline (§12): vet, lint, and the test suite
# across the two-point git matrix.
# The tag half — buildx across amd64+arm64, attestation and the release — is a
# separate workflow, and lands with the release slice.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow reads the source and nothing else. Write scopes live in the
# release job when there is one, never at workflow level (§12).
permissions:
  contents: read

# Superseded PR runs are cancelled; a run on main never is. main's verdict
# belongs to the commit sitting on it, and cancelling one leaves a commit
# nothing ever checked — which is the state this workflow exists to make
# impossible.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Vet and lint
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are SHA-pinned: a tag is a mutable pointer, and this
      # workflow builds a container that will hold a write-scoped credential.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # go-version-file rather than a version literal, so the Go the workflow
      # runs is the Go go.mod asks for and there is one number, not two.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Pinned to the version the sandbox image carries, so a lint failure in
      # CI is one a contributor can reproduce rather than discover.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

  # The git matrix (§12, #32). Two points, and no third: the **floor**, which is
  # the oldest git obsync promises to run on and the only thing testing the
  # *promise*, and the **current** point, which is the git the shipped image
  # actually carries and the only thing testing the *product*.
  #
  # Neither number is written here. The floor is read from `internal/git/
  # GIT_FLOOR`, which is the same file the binary embeds for gate 7 — one file,
  # two readers, so drift is structurally impossible rather than merely
  # detected. The current point is *derived* from the base image by asking the
  # image what git it has, so it follows a digest bump automatically and nobody
  # has to remember to move a number.
  #
  # Both points are then built from source at the version resolved, because
  # `go test` has to run *against* that git and not merely know its number. A
  # prefix install carries its own libexec, so putting `<prefix>/bin` at the
  # front of PATH swaps the whole git — plumbing, remote helpers and all — which
  # is the only way a matrix point tests anything. It is installed under $HOME
  # rather than /opt so that the cache action, which runs as the runner user,
  # can save and restore it without sudo.
  matrix-test:
    name: Test on git ${{ matrix.point }}
    runs-on: ubuntu-latest
    strategy:
      # Both points always run. A matrix that stops at the first failure hides
      # which of the two a change broke, which is the one thing the matrix is
      # for.
      fail-fast: false
      matrix:
        point: [floor, current]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Neither point's number is written here. The floor is read from the one
      # file the binary embeds for gate 7; the current point is read off the
      # Dockerfile's own base image and then asked of it, so a Dependabot digest
      # bump moves the matrix with no second number to remember (§12).
      #
      # The base is the *last* FROM — the image obsync ships on, not the builder
      # it is compiled in — and the flags on a cross-compiling FROM are skipped,
      # so `FROM --platform=$BUILDPLATFORM golang AS builder` cannot be mistaken
      # for it.
      - name: Resolve this point's git version
        id: git
        run: |
          set -euo pipefail
          if [ "${{ matrix.point }}" = "floor" ]; then
            version="$(tr -d '[:space:]' < internal/git/GIT_FLOOR)"
          else
            base="$(awk 'toupper($1) == "FROM" {
              for (i = 2; i <= NF; i++) if ($i !~ /^--/) { image = $i; break }
            } END { print image }' Dockerfile)"
            # The base image carries no git until the shipped image installs
            # one, so the version is asked of the package it would install.
            version="$(docker run --rm "$base" \
              sh -c 'apk add --no-cache git >/dev/null 2>&1 && git --version' | awk '{print $3}')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "This point is git $version"

      - name: Cache this point's git
        id: cached
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/git/${{ steps.git.outputs.version }}
          key: git-${{ runner.os }}-${{ steps.git.outputs.version }}

      # The release tarball rather than a GitHub tag archive: it carries the
      # `version` file GIT-VERSION-GEN reads, so the git this builds reports the
      # number it was built at rather than the previous release's DEF_VER.
      # NO_TCLTK because gitk is not a thing obsync drives.
      #
      # The tarball is fetched to disk and then unpacked, rather than piped
      # straight into `tar -xz`, and that ordering is the whole point: a piped
      # transfer that dies mid-stream has already unpacked a partial tree, so
      # there is nothing left to retry onto. A file can simply be fetched again.
      #
      # And it is fetched from kernel.org's three front doors in turn. They
      # serve the same bytes off different infrastructure, and on 2026-08-27
      # `mirrors.edge` refused connections for long enough to fail every run in
      # the window — including a Dependabot PR that touched nothing but go.mod
      # and go.sum. A check that goes red without saying anything about the
      # change underneath it teaches everyone to re-run rather than read, which
      # is the one habit this pipeline cannot afford (§12).
      #
      # No version is spelled here, and none may be: the floor is read from
      # internal/git/GIT_FLOOR and nowhere else. These are hostnames only.
      - name: Build git ${{ steps.git.outputs.version }} from source
        if: steps.cached.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.git.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gettext libcurl4-openssl-dev libexpat1-dev libssl-dev libz-dev
          mkdir -p "$RUNNER_TEMP/git-src"
          tarball="$RUNNER_TEMP/git-$VERSION.tar.gz"
          for host in mirrors.edge.kernel.org cdn.kernel.org www.kernel.org; do
            echo "Fetching git $VERSION from $host"
            if curl -fsSL --connect-timeout 20 --max-time 300 \
                 --retry 3 --retry-delay 5 --retry-all-errors \
                 -o "$tarball" \
                 "https://$host/pub/software/scm/git/git-$VERSION.tar.gz"; then
              break
            fi
            echo "::warning::$host did not serve git $VERSION; trying the next mirror"
            rm -f "$tarball"
          done
          if [ ! -s "$tarball" ]; then
            echo "::error::no kernel.org mirror served git $VERSION"
            exit 1
          fi
          tar -xzf "$tarball" -C "$RUNNER_TEMP/git-src" --strip-components=1
          make -C "$RUNNER_TEMP/git-src" -j"$(nproc)" prefix="$HOME/git/$VERSION" NO_TCLTK=YES all
          make -C "$RUNNER_TEMP/git-src" prefix="$HOME/git/$VERSION" NO_TCLTK=YES install

      # obsync is one serialized loop and a watcher feeding a channel, so -race
      # should never have anything to say; the day it does, it is right.
      #
      # The version is echoed because a point that silently ran the runner's own
      # git would pass and mean nothing, which is the one way this job can be
      # green and worthless.
      - name: Test
        env:
          VERSION: ${{ steps.git.outputs.version }}
        run: |
          set -euo pipefail
          export PATH="$HOME/git/$VERSION/bin:$PATH"
          git --version
          go test -race ./...

  # The coverage number, and the badge the README carries.
  #
  # It runs the suite once more rather than reading a profile out of the matrix
  # above, and that is deliberate on two counts. The matrix runs `-race` at two
  # pinned gits, because what it tests is the *promise*; what this job counts is
  # which lines of obsync a test executed, and that answer does not move with
  # the git underneath it. And a job that took a profile from a matrix point
  # would have to name which point, which is a third number to keep in step.
  #
  # Only on a push to main. A pull request has nothing it may publish to — a
  # fork's token cannot write to this repository at all — so a coverage job
  # that ran there could only ever be a red cross on somebody else's work.
  coverage:
    name: Coverage
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The one write scope in this workflow, and it is here rather than at
    # workflow level (§12). It reaches the badges branch and nothing else.
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # -coverpkg=./... rather than the default, and it is the difference
      # between a number and a misleading one. Every test obsync has lives in
      # the root package and drives the internal packages through it, and by
      # default Go credits a package's coverage only to that package's own
      # tests — so internal/vault, internal/git and the rest would each report
      # 0% and the badge would say the suite touches almost nothing.
      - name: Measure
        id: cover
        run: |
          set -euo pipefail
          go test -coverpkg=./... -coverprofile=coverage.out ./...
          pct="$(go tool cover -func=coverage.out | awk '$1 == "total:" { print $3 }')"
          if [ -z "$pct" ]; then
            echo "::error::the coverage profile has no total line"
            exit 1
          fi
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "Total coverage: $pct"

      # The badge is a shields.io *endpoint*: this job publishes the number as
      # JSON and shields renders it. Publishing a rendered SVG instead would
      # work once and then not — GitHub proxies README images through a cache
      # that has no idea the file changed, so the badge would show whatever
      # percentage was true the first time somebody looked.
      #
      # It lands on an orphan `badges` branch that is force-pushed to one
      # commit every time, because the branch is a value rather than a history:
      # nothing needs last week's number, and a branch that only ever grows is
      # one somebody has to prune later.
      - name: Publish the badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PCT: ${{ steps.cover.outputs.pct }}
        run: |
          set -euo pipefail
          colour="$(awk -v n="${PCT%\%}" 'BEGIN {
            print n < 50 ? "red" : n < 70 ? "orange" : n < 80 ? "yellow" :
                  n < 90 ? "yellowgreen" : "brightgreen"
          }')"
          badge="$(mktemp -d)"
          printf '{"schemaVersion":1,"label":"coverage","message":"%s","color":"%s","cacheSeconds":300}\n' \
            "$PCT" "$colour" > "$badge/coverage.json"
          cd "$badge"
          git init --quiet --initial-branch=badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit --quiet -m "Coverage: $PCT at ${GITHUB_SHA:0:7}"
          git push --quiet --force \
            "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" badges

  # Seam 2 (§12, #41): the container image and the reference compose, which are
  # the two things no in-process test can see — the image running as an
  # arbitrary UID with no `/etc/passwd` entry, the git floor gate firing, the
  # `HEALTHCHECK` being wired, and the credential file being re-read.
  #
  # amd64 only here, and both architectures at release time: the architecture
  # risk is near zero when every expensive operation is a git subprocess, and
  # cross-compiling means the arm64 image costs no emulation to *build*. What it
  # would cost is emulation to *run*, which is what a PR does not spend.
  #
  # The suite builds the image itself rather than taking one built by a step
  # above it, so that what is smoke-tested is this checkout's Dockerfile and the
  # version it is stamped with is the one the tests assert on.
  image:
    name: Seam 2 — the image and the reference compose
    runs-on: ubuntu-latest
    steps:
      # The whole history, and it is the tags this job is after. The reference
      # compose's pin is asserted to be the floating name of the newest release
      # (§12), and the newest release is a `vMAJOR.MINOR.PATCH` tag — which the
      # default shallow checkout does not fetch. The suite refuses to run that
      # assertion against a shallow checkout rather than pass while measuring
      # nothing, so this line is what the assertion stands on.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The buildx builder the suite's `docker buildx build --load` needs. No
      # QEMU is set up: nothing in this job runs an arm64 image.
      - name: Set up buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # SEAM2 is what asks for it: without it the same suite skips the image and
      # runs seam 1 alone, which is what every other job and every developer's
      # loop does. The run is scoped to the seam-2 tests by name — seam 1 is
      # already run across both matrix points above, and running it a third time
      # here would buy nothing.
      - name: Build the image and smoke-test it
        env:
          SEAM2: "1"
        run: go test -run '^(TestTheImage|TestTheReferenceCompose)' -timeout 25m -v .
